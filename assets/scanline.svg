<svg width="900" height="8" viewBox="0 0 900 8" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="8" fill="#161b22"/>
  <rect x="-140" y="0" width="140" height="8" fill="url(#pulseGrad)">
    <animate attributeName="x" values="-140;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
