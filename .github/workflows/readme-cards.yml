name: update-readme-cards

on:
  schedule:
    - cron: "0 0 * * *"   # once daily
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=aleenagibi&show_icons=true&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=aleenagibi&layout=compact&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&border_color=30363D
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — cross-phase-defense-framework
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=cross-phase-defense-framework&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-cross-phase-defense-framework.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — hybrid-ai-chatbot
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=hybrid-ai-chatbot&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-hybrid-ai-chatbot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — HoneyTrap
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=HoneyTrap&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-honeytrap.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — FileGuard
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=FileGuard&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-fileguard.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — Blockchain-Based-Voting-System
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=Blockchain-Based-Voting-System&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-blockchain-voting.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — school-template-engine
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=school-template-engine&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-school-template-engine.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — Campus_Path_Finder
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=aleenagibi&repo=Campus_Path_Finder&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9&icon_color=39FF14&border_color=30363D
          path: assets/pin-campus-path-finder.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: update stats + pin cards"
          git push
