<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bgGrad)"/>

  <!-- faint grid -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="0" y1="55" x2="900" y2="55"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
  </g>

  <!-- top log line -->
  <text x="24" y="26" font-family="'Fira Code', monospace" font-size="12" fill="#6e7681">$ python cross_phase_scan.py --target=visitor --mode=defense</text>

  <!-- red adversarial warning (glitch phase) -->
  <text x="450" y="50" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" fill="#ff3b3b" opacity="0">
    [ ADVERSARIAL INPUT DETECTED — INITIATING CROSS-PHASE DEFENSE ]
    <animate attributeName="opacity" values="0;1;0.2;1;0;0;0" keyTimes="0;0.03;0.06;0.09;0.12;0.5;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- chromatic aberration duplicate: red, offset -->
  <text x="454" y="118" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="48" fill="#ff3b3b" opacity="0">
    ALEENA GIBI
    <animate attributeName="opacity" values="0;0.8;0;0.7;0;0.6;0;0;0" keyTimes="0;0.02;0.035;0.05;0.065;0.08;0.1;0.19;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="454;447;454;460;454;446;450" keyTimes="0;0.02;0.035;0.05;0.065;0.08;0.19" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- chromatic aberration duplicate: cyan, offset opposite -->
  <text x="446" y="118" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="48" fill="#00e5ff" opacity="0">
    ALEENA GIBI
    <animate attributeName="opacity" values="0;0.8;0;0.7;0;0.6;0;0;0" keyTimes="0;0.02;0.035;0.05;0.065;0.08;0.1;0.19;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="446;453;446;440;446;454;450" keyTimes="0;0.02;0.035;0.05;0.065;0.08;0.19" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- stable clean title -->
  <text x="450" y="118" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="48" fill="#e6f7ec" opacity="0">
    ALEENA GIBI
    <animate attributeName="opacity" values="0;0;0.3;0.6;1;1;1;0" keyTimes="0;0.1;0.14;0.17;0.2;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <text x="450" y="150" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" fill="#39ff14" opacity="0">
    AI SECURITY RESEARCHER · FULL-STACK ENGINEER
    <animate attributeName="opacity" values="0;0;0;1;1;1;0" keyTimes="0;0.2;0.24;0.28;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- status line -->
  <text x="450" y="182" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12.5" fill="#8b949e" opacity="0">
    STATUS: <tspan fill="#39ff14">SECURE</tspan> — sanitization ✓  adversarial training ✓  backdoor detection ✓
    <animate attributeName="opacity" values="0;0;0;1;1;1;0" keyTimes="0;0.28;0.32;0.36;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- bottom log line -->
  <text x="24" y="206" font-family="'Fira Code', monospace" font-size="11" fill="#484f58" opacity="0">
    &gt; exit_code: 0  |  threat_level: neutralized  |  paper: Cross-Phase Defense Framework (Best Paper, ICEIBT 2026)
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.9;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- sweeping scanline -->
  <rect x="0" y="0" width="6" height="220" fill="url(#scanGlow)" opacity="0.55">
    <animate attributeName="x" values="-6;900;-6" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
